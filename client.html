<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QResto — Redirection…</title>
  <!--
    Cette page n'est plus la page de commande : celle-ci est désormais
    absorbée par la vitrine (resto.html), qui gère à la fois le mode sur place
    (jeton QR) et les modes à distance. On redirige simplement pour que les
    QR déjà imprimés continuent de marcher.
  -->
  <script>
    var q = location.search;
    location.replace('resto.html' + (q || ''));
  </script>
</head>
<body>
  <noscript>
    <p>Cette page a déménagé. <a id="lien" href="resto.html">Continuer</a></p>
    <script>document.getElementById('lien').href = 'resto.html' + location.search;</script>
  </noscript>
</body>
</html>
