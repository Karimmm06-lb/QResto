<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QResto — Statistiques</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Q<span>Resto</span></div>
    <div class="badge">📊 Statistiques</div>
    <div class="spacer"></div>
    <button class="btn sm ghost" id="seedBtn">🎲 Données de démo</button>
    <button class="btn sm ghost" id="clearBtn">🗑️ Tout effacer</button>
  </header>

  <main class="wrap">
    <div class="stats" style="margin-top:18px">
      <div class="card stat"><div class="v" id="ca">0 DA</div><div class="k">Chiffre d'affaires</div></div>
      <div class="card stat"><div class="v" id="nb">0</div><div class="k">Commandes</div></div>
      <div class="card stat"><div class="v" id="moy">0 DA</div><div class="k">Panier moyen</div></div>
      <div class="card stat"><div class="v" id="attente">0 min</div><div class="k">Attente moyenne estimée</div></div>
    </div>

    <h2>Plats les plus vendus</h2>
    <div class="card" id="top"></div>

    <h2>Commandes par heure</h2>
    <div class="card" id="hours"></div>

    <h2>Chiffre d'affaires par table</h2>
    <div class="card" id="tables"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
