<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#c9a24a">
  <meta name="robots" content="noindex, nofollow">
  <title>QR codes à imprimer — QResto</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="img/favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>
  <header class="topbar" id="barre" style="display:none">
    <div class="brand">Q<span>Resto</span></div>
    <div class="badge">🖨️ QR codes</div>
    <div class="spacer"></div>
    <a class="btn sm ghost" href="caisse.html">🧾 Caisse</a>
    <a class="btn sm ghost" href="admin.html">📊 Gérant</a>
    <button class="btn sm" id="printBtn">Imprimer</button>
  </header>

  <div id="erreur" class="alerte"></div>

  <main class="wrap narrow login" id="loginView">
    <a class="lien-retour" href="/resto.html?r=team-restaurant">← Retour au restaurant</a>
    <nav class="onglets-login" aria-label="Espaces du personnel">
      <a href="caisse.html">Caisse</a>
      <a href="admin.html">Gérant</a>
      <a class="actif" aria-current="page">QR codes</a>
    </nav>
    <div class="card">
      <h1 style="margin-top:0">QR codes des tables</h1>
      <p class="sub">Connexion requise.</p>
      <input id="email" type="email" placeholder="Adresse e-mail" autocomplete="username">
      <input id="mdp" type="password" placeholder="Mot de passe" autocomplete="current-password">
      <button class="btn wide" id="loginBtn">Se connecter</button>
    </div>
  </main>

  <main class="wrap" id="appView" style="display:none">
    <p class="sub" id="consigne"></p>
    <div class="feuille" id="feuille"></div>
  </main>

  <script src="js/config.js?v=2"></script>
  <script src="js/data.js?v=2"></script>
  <script src="js/store.js?v=2"></script>
  <script src="js/qr.js?v=2"></script>
</body>
</html>
