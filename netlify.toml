# Configuration Netlify — QResto
#
# Site 100 % statique (HTML/CSS/JS natifs, aucune build) : Netlify sert
# directement la racine du dépôt.

[build]
  publish = "."
  # Cache-busting automatique : à chaque build, tous les ?v=… dans les HTML
  # sont remplacés par le hash court du commit. Les navigateurs re-téléchargent
  # donc systématiquement les JS/CSS après un déploiement, sans que je doive
  # bumper les versions à la main dans 6 fichiers.
  command = "bash scripts/cache-bust.sh"

# Racine → vitrine du restaurant (une seule instance en production).
# Le paramètre ?r=team-restaurant reste supporté ; on redirige simplement la
# racine vers la vitrine par défaut pour éviter un 404 sur qresto.dz.
[[redirects]]
  from = "/"
  to = "/resto.html?r=team-restaurant"
  status = 302
  force = false

# Les QR imprimés qui pointent encore vers /client.html?t=… continuent de
# fonctionner grâce à la redirection interne dans client.html, mais on fournit
# aussi une redirection côté Netlify pour couvrir les cas sans JavaScript.
[[redirects]]
  from = "/client.html"
  to = "/resto.html"
  status = 302
  force = false

# URLs courtes sans .html — standard pour un site professionnel.
# Rewrite (200) et non redirect (302) : l'URL affichée reste /caisse,
# le navigateur ne voit jamais /caisse.html.
[[redirects]]
  from = "/caisse"
  to = "/caisse.html"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
[[redirects]]
  from = "/qr"
  to = "/qr.html"
  status = 200
[[redirects]]
  from = "/resto"
  to = "/resto.html"
  status = 200
[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

# 404 personnalisé : Netlify sert /404.html automatiquement pour toute URL
# qui n'existe pas — pas besoin d'une règle explicite, qui aurait risqué
# d'intercepter des chemins valides selon l'ordre d'évaluation.

# En-têtes de sécurité — CSP stricte, HSTS, protections navigateur.
# Google Fonts et Supabase sont explicitement autorisés ; tout le reste
# est interdit par défaut, ce qui bloque les injections tierces.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Cache long pour les assets versionnés (CSS/JS avec ?v=N).
# Les HTML restent en no-cache pour que les changements soient visibles.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
