<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>QResto — Commander</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="restoNom">Q<span>Resto</span></div>
    <div class="badge" id="tableBadge">…</div>
    <div class="spacer"></div>
    <div class="langs">
      <button data-lang="fr">FR</button>
      <button data-lang="ar">ع</button>
      <button data-lang="en">EN</button>
    </div>
  </header>

  <div id="erreur" class="alerte"></div>

  <main class="wrap narrow">
    <div id="menuView">
      <div class="cats" id="cats"></div>
      <div class="grid" id="dishes"></div>
    </div>
    <div id="panierView" style="display:none"></div>
    <div id="confirmView" style="display:none"></div>
  </main>

  <div class="cartbar" id="cartbar" style="display:none">
    <div class="inner">
      <div>
        <div style="font-size:13px;color:var(--muted)" id="cartCount"></div>
        <div style="font-weight:800;font-size:18px" id="cartTotal"></div>
      </div>
      <div class="spacer"></div>
      <button class="btn" id="sendBtn"></button>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/client.js"></script>
</body>
</html>
