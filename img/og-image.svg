<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="fondOg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a0f05"/>
      <stop offset="100%" stop-color="#3a2416"/>
    </linearGradient>
    <linearGradient id="orOg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e6c78a"/>
      <stop offset="60%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#8a6c1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#fondOg)"/>
  <!-- Cadre doré fin -->
  <rect x="40" y="40" width="1120" height="550" fill="none"
        stroke="url(#orOg)" stroke-width="2" opacity="0.6"/>
  <!-- Kicker -->
  <text x="600" y="180" text-anchor="middle"
        font-family="Jost, 'Helvetica Neue', Arial, sans-serif"
        font-size="22" font-weight="400" fill="#e6c78a" letter-spacing="8">
    AÏN BENIAN, ALGER
  </text>
  <!-- Titre -->
  <text x="600" y="290" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="96" font-weight="500" fill="#f8f3ea">
    Team Restaurant
  </text>
  <!-- Filet + étoile -->
  <line x1="500" y1="340" x2="700" y2="340" stroke="url(#orOg)" stroke-width="1.5"/>
  <g fill="url(#orOg)" transform="translate(600 340)">
    <path d="M0 -14 L2.5 -2.5 L14 0 L2.5 2.5 L0 14 L-2.5 2.5 L-14 0 L-2.5 -2.5 Z"/>
  </g>
  <!-- Slogan -->
  <text x="600" y="410" text-anchor="middle"
        font-family="'Cormorant Garamond', Georgia, serif"
        font-size="32" font-style="italic" fill="#eee3ce">
    Pizza &amp; calzone au feu de bois — Grillades — Café
  </text>
  <!-- CTA -->
  <text x="600" y="510" text-anchor="middle"
        font-family="Jost, 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="500" fill="#c9a24a" letter-spacing="4">
    COMMANDER · SUR PLACE · À EMPORTER · LIVRAISON
  </text>
</svg>
